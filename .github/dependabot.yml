version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test"
    schedule:
      interval: "monthly"
    # Standard libraries are versioned with Julia itself, so a [compat] entry
    # on one is not a requirement that can be bumped.
    ignore:
      - dependency-name: "Test"
      - dependency-name: "TOML"
      - dependency-name: "Printf"
