name: Format
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # JuliaFormatter is not a dependency of the package or its tests, so it
      # is installed into a temporary environment, held to the major version
      # the sources were formatted with.
      - name: Check against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add(name = "JuliaFormatter", version = "2.14 - 2")
          using JuliaFormatter
          if !format("."; overwrite = false)
              format(".")
              run(`git --no-pager diff`)
              @error """
              Formatting differs from .JuliaFormatter.toml; the diff above is the
              correction. Run

                  julia -e 'using JuliaFormatter; format(".")'

              and commit the result.
              """
              exit(1)
          end
