name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
      id-token: write # Codecov authenticates the coverage upload through OpenID Connect
    strategy:
      fail-fast: false
      matrix:
        version:
          # The [compat] floor in Project.toml, the current release, and the
          # next one.
          - 'lts'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # JuliaFormatter is not a dependency of the package or its tests, so it
      # goes into a throwaway environment, held to the major version whose
      # output the sources were formatted with.
      - name: Check against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add(name = "JuliaFormatter", version = "2.14 - 2")
          using JuliaFormatter
          if !format("."; overwrite = false)
              format(".")
              run(`git --no-pager diff`)
              @error """
              Formatting differs from .JuliaFormatter.toml; the diff above is the
              correction. Run

                  julia -e 'using JuliaFormatter; format(".")'

              and commit the result.
              """
              exit(1)
          end
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --color=yes {0}
        run: |
          include(joinpath(pwd(), "docs", "activate.jl"))
          using Documenter: DocMeta, doctest
          using AtmosphericDispersion
          DocMeta.setdocmeta!(AtmosphericDispersion, :DocTestSetup, :(using AtmosphericDispersion); recursive=true)
          doctest(AtmosphericDispersion)
