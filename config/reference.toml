# Reference case: tritium (HTO) released from a CANDU stack.

[source]
height = 50.3             # stack height above ground, m; > 0
diameter = 2.33           # inner diameter at the exit, m; > 0
exit_velocity = 10.0      # vertical gas velocity at the exit, m/s; >= 0
exit_density = 0.6        # density of the emitted gas, kg/m^3; > 0
exit_temperature = 324.0  # temperature of the emitted gas, K; > 0

[atmosphere]
reference_speed = 4.0     # wind speed at 10 m, m/s; >= 0
temperature = 287.0       # ambient air temperature, K; > 0
density = 1.2             # ambient air density, kg/m^3; > 0
lapse_rate = 0.02         # vertical temperature gradient dT/dz, K/m; finite
specific_heat = 1005.0    # isobaric specific heat of ambient air, J/(kg K); > 0
surface = "agricultural"  # wind-profile surface; one of: water | agricultural | forest_urban
roughness = "pasture"     # roughness class; one of: grassland_water | arable | pasture | rural | forest_urban | metropolis

[model]
plume_rise = "briggs"       # plume-rise constants; one of: briggs | xoqdoq | nsr23
resuspension = "iaea_ss57"  # resuspension factor; one of: iaea_ss57 | maxwell_anspaugh
washout = "normative"       # washout scheme; one of: normative | hto

[mixing_layer]
scheme = "tabulated"          # depth of the mixing layer; one of: tabulated | uniform | custom | unbounded
above_lid = "rise_inhibited"  # plume above the lid; one of: rise_inhibited | full_penetration
# uniform_depth = 800.0       # single depth for all classes, m; > 0; only with scheme = "uniform"
# depths = [1300.0, 900.0, 850.0, 800.0, 400.0, 100.0]  # per class A to F, m; each > 0, inf for none; only with scheme = "custom"

[buildings]
wake_coefficient = 1.0    # wake broadening coefficient C in sqrt(sigma^2 + C A/pi); >= 0, 0 disables
# Repeat [[buildings.building]] for each structure; omit the block for none.
# [[buildings.building]]
# east = 30.0             # displacement from the stack, m
# north = 0.0             # displacement from the stack, m
# height = 20.0           # building height, m; >= 0
# frontal_area = 400.0    # cross-section presented to the wind, m^2; >= 0

[nuclide]
name = "HTO"                        # label of the released species
decay_constant = 1.784e-9           # radioactive decay constant, 1/s; >= 0
deposition_velocity_low = 0.004     # used for plume depletion, m/s; >= 0
deposition_velocity_high = 0.008    # used for ground deposition, m/s; >= low
washout_species = "tritium_iodine"  # row of the washout table; one of: tritium_iodine | other

[wind_rose]
sectors = 16                 # number of sectors; even, >= 4
convention = "blowing_from"  # sense of the frequencies; one of: blowing_from | blowing_toward
# One frequency per sector, clockwise from north; each >= 0, summing to 1.
frequencies = [
  0.078491, 0.078491, 0.072211, 0.073781,
  0.078491, 0.059651, 0.056511, 0.047100,
  0.051811, 0.050241, 0.048670, 0.045530,
  0.054951, 0.064361, 0.062791, 0.076921,
]
# One fraction per Pasquill class A to F; each >= 0, summing to 1.
stability = [0.065331, 0.065331, 0.065331, 0.488005, 0.158002, 0.158002]

[release]
activity = 6.8e14         # released activity, Bq; >= 0
duration = 31557600.0     # release duration, s; > 0

[precipitation]
type = "rain"             # one of: rain | snow
rate = 1.0                # intensity, mm/h; one of: 0.5 | 1.0 | 3.0 | 5.0
washout_duration = 0.0    # duration of the washout event, s; >= 0

[grid]
extent = 20000.0          # half-width of the receptor grid, m; > 0
spacing = 250.0           # receptor spacing, m; > 0 and < extent
